[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portrait-commerce-bot"
version = "0.4.0"
description = "Commercial Telegram bot for paid AI sticker generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<3",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "qrcode[pil]>=8,<9",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "redis>=6.2,<8",
  "cachetools>=5.5,<7",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
portrait-bot = "portrait_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portrait_bot", "src/bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
