templates:
  - slug: royal
    title: "Король и королева"
    description: "Премиальный современный королевский образ с выразительными эмоциями."
    category: "Коллекции"
    prompt: >-
      Transform the uploaded adult person into an original premium cartoon Telegram
      sticker. Preserve the person's recognizable facial identity, hairstyle, skin
      tone, glasses and distinctive features. Polished 3D illustration, expressive
      friendly pose, refined royal styling, tasteful gold details, bold white sticker
      outline, isolated subject on a perfectly flat solid #FF00FF chroma-key
      background, centered with generous padding. Do not use #FF00FF in the subject.
      No text, letters, logos, watermark, copyrighted characters or imitation of any
      named film, animation, game or celebrity.
    preview_path: "assets/previews/collection-royal.png"
    credits: 1
    active: true
    sort_order: 10
    version: 4

